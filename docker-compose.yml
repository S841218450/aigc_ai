services:
  aigc-ai:
    build: .
    image: aigc-ai:latest
    container_name: aigc-ai
    restart: unless-stopped
    # 密钥等配置从 .env 注入，不写死在镜像里
    env_file:
      - .env
    environment:
      # 容器内 localhost 指向容器自身，需按实际部署环境修改为真实后端地址
      # 部署在同一台宿主机时可用 host.docker.internal
      JAVA_API_BASE_URL: http://host.docker.internal:48080/admin-api/
      MONGODB_URL: mongodb://host.docker.internal:27017
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      # SQLite 数据落到挂载卷，避免容器重建丢失
      DATABASE_URL: sqlite:////app/data/aigc_platform.db
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
      - ./chroma_db:/app/chroma_db
      - ./data:/app/data
    # Linux Docker Engine 下解析 host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
