[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "aigc-platform"
version = "0.1.0"
description = "AIGC平台"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "langchain>=1.3.4",
    "langchain-openai>=1.2.2",
    "langchain-tavily>=0.2.18",
    "langgraph-cli[inmem]>=0.1.0",
    "langgraph>=1.2.4",
    "langgraph-checkpoint-postgres>=3.1.0",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "load-dotenv>=0.1.0",
    "postgres>=4.0",
    "langchain-ollama>=1.1.0",
    "langchain-community>=0.4.2",
    "chromadb>=1.5.9",
    "langchain-chroma>=1.1.0",
    "logger>=1.4",
    "streamlit>=1.58.0",
    "document>=1.0",
    "fastapi>=0.139.0",
    "command>=0.1.0",
    "langgraph-checkpoint-mongodb>=0.4.0",
    "pymongo>=4.16.0",
    "httpx>=0.28.0",
    "hypercorn>=0.18.0",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.3",
    "black>=24.1.1",
    "ruff>=0.1.11"
]
